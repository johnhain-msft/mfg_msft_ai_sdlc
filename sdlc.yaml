          import { readFileSync } from "node:fs";
          const file = process.env.GITHUB_WORKSPACE + "/portfolio/experiences/github-intermediate-labs/provenance.json";
          let doc;
          try { doc = JSON.parse(readFileSync(file, "utf8")); }
          catch { console.error("provenance.json is missing or unparseable"); process.exit(1); }
          const keys = Object.keys(doc).sort().join(",");
          if (keys !== "commit,repository" || doc.repository !== "githubschool/gh-github-intermediate-template" || doc.commit !== process.env.UPSTREAM_SHA) {
            console.error("provenance.json does not record the upstream sha");
            process.exit(1);
          }
          '
        fi
      - |
        # post-run check: the upstream checkout stays read-only
        test -z "$(git -C <checkout> status --porcelain)"
    adaptationInstructions: >-
      Diff the cumulative upstream range and adapt the GitHub Intermediate labs, the Teaching SPA content and their tests only where the upstream change requires it.
      Exclude customer-specific authoring tools. When no adaptation is needed, leave the worktree clean so the run ends without a pull request.
    allowedFiles:
      - experiences/github-intermediate-labs/provenance.json
      - experiences/github-intermediate-labs/src/**
      - experiences/github-intermediate-workshop/content/**
      - public/github-intermediate/**
      - tests/github-intermediate-labs.test.ts
      - tests/github-intermediate-workshop.test.ts
    protectedFilesExclude: []
    autoMerge: false
    immutableGates:
      zeroDiffPaths:
        - experiences/copilot-workshop/content/rules.ts
        - experiences/copilot-workshop/content/source.ts
        - experiences/copilot-workshop/content/types.ts
        - experiences/copilot-workshop/src
        - src
        - scripts
        - tests/auth.test.ts
        - tests/runtime.test.ts
        - tests/catalog.test.ts
        - tests/copilot-workshop-geometry.test.ts
        - tests/copilot-workshop-runtime.test.ts
        - apps/lab-studio/server/src/index.ts
        - apps/lab-studio/server/src/copilot-bridge.ts
        - apps/lab-studio/server/src/sandbox.ts
        - apps/lab-studio/server/src/sim-terminal.ts
        - apps/lab-studio/server/src/skills.ts
        - apps/lab-studio/server/tests/sandbox.test.ts
      lockedTestBlocks:
        - file: tests/github-intermediate-labs.test.ts
          blocks:
            - kind: it
              title: Lab 0 HTTPS prompts accept only simulated credentials and do not retain them
        - file: tests/github-intermediate-workshop.test.ts
          blocks:
            - kind: it
              title: gives every slide a title and non-empty, original speaker notes
            - kind: it
              title: contains no customer names, private framing, personal paths or real emails
      inProcessInvariants:
        frozenModules:
          - experiences/copilot-workshop/content/rules.ts
          - tests/support/customer-terms.ts
        customerTerms:
          module: tests/support/customer-terms.ts
          export: findCustomerTerms
