# Portfolio reference preset for the AI SDLC orchestrator.
#
# This file is data: the engine (src/reconcile.mjs) is repository-agnostic and
# turns it into the generated workflows under .github/workflows/. Edit this file
# (by hand or through `sdlc onboard`), then run the reconciler; never edit a
# generated workflow directly.
#
# `<checkout>` inside any command is replaced by the renderer with the absolute
# path of the upstream checkout, "$UPSTREAM_DIR".
#
# A verifyCommands entry whose first non-blank character is `#` (for example
# "# post-run check: ...") is a post-run check. Every verifyCommands entry runs in
# the order listed here; a post-run check only stays out of the verification gate
# that the reconciler reports for the AI adaptation workflows (SPEC-01 AC50, AC53).

projects:
  - projectKey: gh-admin-msft
    repo: johnhain-msft/gh-admin-msft
    defaultBranch: main
    deconflictInRepoSchedules: none
    deconflictWorkflowIds: []
    driftAudit:
      enabled: true
      schedule: "0 13 * * 1"
      upkeepStrategy: content-and-docs-sync
      instructions: Keep the GitHub Enterprise Cloud administration labs, reference documents and presenter material current against the watched changelogs and documentation.
      instructionsFile: instructions/gh-admin-msft.md
      knowledgeSources:
        watchUrls:
          - url: https://github.blog/changelog/
            label: GitHub changelog
            kind: changelog
          - url: https://github.blog/changelog/label/enterprise/
            label: GitHub Enterprise changelog
            kind: changelog
          - url: https://docs.github.com/en/enterprise-cloud@latest/admin
            label: GitHub Enterprise Cloud administration documentation
            kind: docs
          - url: https://docs.github.com/en/enterprise-cloud@latest/billing
            label: GitHub Enterprise Cloud billing and licensing documentation
            kind: docs
          - url: https://docs.github.com/en/enterprise-cloud@latest/copilot
            label: GitHub Copilot Enterprise documentation
            kind: docs
          - url: https://docs.github.com/en/enterprise-cloud@latest/code-security
            label: GitHub Secret Protection and Code Security documentation
            kind: docs
          - url: https://docs.github.com/en/enterprise-cloud@latest/actions
            label: GitHub Actions Enterprise documentation
            kind: docs
        packageManifests:
          - package.json
        mcpServers:
          microsoft-learn:
            type: http
            url: https://learn.microsoft.com/api/mcp
          context7:
            command: npx
            args:
              - -y
              - "@upstash/context7-mcp@latest"
      buildCommands:
        - node presentation/build.mjs
      verifyCommands:
        - npm ci
        - node presentation/build.mjs
        - test -z "$(git status --porcelain)"
        - npm run test:unit
        - npm run test:freshness
        - npm run test:deck
        - npm test -- --skip-links
      draft: false
      reviewers:
        - johnhain-msft

  - projectKey: copilot-lab
    repo: ms-mfg-community/day-in-the-life-copilot-lab
    defaultBranch: main
    deconflictInRepoSchedules: none
    deconflictWorkflowIds: []
    driftAudit:
      enabled: true
      schedule: "30 5 * * 0"
      upkeepStrategy: content-and-docs-sync
      instructions: Audit the lab content registry and the lab content against the watched sources and propose only safe, mechanical updates.
      instructionsFile: instructions/copilot-lab.md
      knowledgeSources:
        watchUrls:
          - url: https://github.blog/changelog/
            label: GitHub changelog
            kind: changelog
          - url: https://docs.github.com/en/copilot
            label: GitHub Copilot documentation
            kind: docs
          - url: https://github.com/github/gh-aw/releases
            label: GitHub Agentic Workflows releases
            kind: release-notes
          - url: https://github.com/github/copilot-cli/releases
            label: GitHub Copilot CLI releases
            kind: release-notes
        packageManifests:
          - package.json
          - node/package.json
          - "**/*.csproj"
        mcpServers:
          microsoft-learn:
            type: http
            url: https://learn.microsoft.com/api/mcp
          context7:
            command: npx
            args:
              - -y
              - "@upstash/context7-mcp@latest"
      buildCommands: []
      verifyCommands:
        - ( set -euo pipefail; copy="${RUNNER_TEMP:?RUNNER_TEMP is not set}/gh-aw/sdlc-validator"; cmp -s "$copy/validate-copilot-lab-audit.mjs" "$GITHUB_WORKSPACE/src/validate-copilot-lab-audit.mjs" || { echo "src/validate-copilot-lab-audit.mjs is not the copy that prepare-run made before the agent started" >&2; exit 1; }; diff -rq "$copy/drift/lib" "$GITHUB_WORKSPACE/src/drift/lib" >&2 || { echo "src/drift/lib is not the copy that prepare-run made before the agent started" >&2; exit 1; }; node "$GITHUB_WORKSPACE/src/validate-copilot-lab-audit.mjs" )
        - ( set -euo pipefail; for f in tests/content-currency/registry-consumed.test.ts tests/lab-structure/lab10-contract.test.ts tests/workshop/time-budget.test.ts; do test -f "$f" || { echo "missing required test file $f" >&2; exit 1; }; done; GH_DATA_DIR="$(mktemp -d)"; export GH_DATA_DIR; XDG_DATA_HOME="$GH_DATA_DIR"; export XDG_DATA_HOME; gh extension install github/gh-aw --pin v0.86.2; npm ci; npm test )
      draft: false
      reviewers: []

