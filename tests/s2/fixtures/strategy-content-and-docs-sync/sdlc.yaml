# A fixture for SPEC-02 AC14: one project whose upkeepStrategy is content-and-docs-sync.
projects:
  - projectKey: fixture-docs-sync
    repo: example-owner/fixture-docs-sync
    defaultBranch: main
    driftAudit:
      enabled: true
      schedule: "0 6 * * 1"
      upkeepStrategy: content-and-docs-sync
      instructions: INLINE-INSTRUCTIONS-DOCS-SYNC keep the documentation current.
      instructionsFile: instructions/fixture.md
      knowledgeSources:
        watchUrls:
          - url: https://changelog.example.test/changelog
            label: Example changelog
            kind: changelog
        packageManifests:
          - package.json
        mcpServers:
          microsoft-learn:
            type: http
            url: https://learn.microsoft.com/api/mcp
      buildCommands: []
      verifyCommands:
        - npm test
      draft: false
      reviewers: []
