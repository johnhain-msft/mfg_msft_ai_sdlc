# A fixture for SPEC-02 AC14: one project whose upkeepStrategy is dependency-and-pattern-modernization.
projects:
  - projectKey: fixture-modernization
    repo: example-owner/fixture-modernization
    defaultBranch: main
    driftAudit:
      enabled: true
      schedule: "30 6 * * 2"
      upkeepStrategy: dependency-and-pattern-modernization
      instructions: INLINE-INSTRUCTIONS-MODERNIZATION move to the next major of each framework.
      instructionsFile: instructions/fixture.md
      knowledgeSources:
        watchUrls:
          - url: https://blog.example.test/releases
            label: Framework releases
            kind: release-notes
        packageManifests:
          - package.json
          - "**/*.csproj"
        mcpServers:
          context7:
            command: npx
            args:
              - -y
              - "@upstash/context7-mcp@latest"
      buildCommands:
        - npm run build
      verifyCommands:
        - npm ci
        - npm test
      draft: true
      reviewers:
        - example-reviewer
