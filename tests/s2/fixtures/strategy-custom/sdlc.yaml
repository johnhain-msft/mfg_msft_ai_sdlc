# A fixture for SPEC-02 AC15: a project whose upkeepStrategy is custom, so that its registration instructions are all the agent follows.
projects:
  - projectKey: fixture-custom
    repo: example-owner/fixture-custom
    defaultBranch: main
    driftAudit:
      enabled: true
      schedule: "15 5 * * 3"
      upkeepStrategy: custom
      instructions: ""
      instructionsFile: instructions/custom.md
      knowledgeSources:
        watchUrls:
          - url: https://changelog.example.test/custom
            label: Custom source
            kind: feed
        packageManifests: []
        mcpServers: {}
      buildCommands: []
      verifyCommands:
        - npm test
      draft: false
      reviewers: []
