# Rejected (SPEC-02 AC6): a watched URL with a wildcard host (gh aw compile --strict forbids wildcard domains).
projects:
  - projectKey: wildcard-url
    repo: acme-labs/wildcard-url
    defaultBranch: main
    driftAudit:
      enabled: true
      schedule: "0 6 * * 1"
      upkeepStrategy: content-and-docs-sync
      instructions: Keep the documentation current.
      instructionsFile: null
      knowledgeSources:
        watchUrls:
          - url: https://*.example.org/changelog
            label: Every example host
            kind: changelog
        packageManifests: []
        mcpServers: {}
      buildCommands: []
      verifyCommands:
        - npm test
      draft: false
      reviewers:
        - acme-reviewer
