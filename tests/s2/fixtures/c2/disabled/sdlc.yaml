# Every project has driftAudit.enabled: false, so the reconciler renders no drift workflow at all (SPEC-02 AC1).
projects:
  - projectKey: dormant-service
    repo: acme-labs/dormant-service
    defaultBranch: main
    driftAudit:
      enabled: false
      schedule: "0 6 * * 1"
      upkeepStrategy: content-and-docs-sync
      instructions: ""
      instructionsFile: null
      knowledgeSources:
        watchUrls: []
        packageManifests: []
        mcpServers: {}
      buildCommands: []
      verifyCommands: []
      draft: false
      reviewers: []
  - projectKey: dormant-docs
    repo: acme-labs/dormant-docs
    defaultBranch: main
    driftAudit:
      enabled: false
      schedule: "0 7 * * 2"
      upkeepStrategy: custom
      instructions: ""
      instructionsFile: null
      knowledgeSources:
        watchUrls: []
        packageManifests: []
        mcpServers: {}
      buildCommands: []
      verifyCommands: []
      draft: false
      reviewers: []
