# A fixture for SPEC-02 AC14: one project whose upkeepStrategy is code-quality-and-improvement-scan.
projects:
  - projectKey: fixture-quality-scan
    repo: example-owner/fixture-quality-scan
    defaultBranch: main
    driftAudit:
      enabled: true
      schedule: "0 7 1 * *"
      upkeepStrategy: code-quality-and-improvement-scan
      instructions: INLINE-INSTRUCTIONS-QUALITY-SCAN look for small, safe quality improvements.
      instructionsFile: instructions/fixture.md
      knowledgeSources:
        watchUrls:
          - url: https://docs.example.test/style-guide
            label: Style guide
            kind: docs
        packageManifests: []
        mcpServers: {}
      buildCommands: []
      verifyCommands:
        - npm run lint
      draft: true
      reviewers: []
