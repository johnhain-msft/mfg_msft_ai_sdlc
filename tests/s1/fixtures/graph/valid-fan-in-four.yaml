# Four edges into one downstream repository.
projects:
  - projectKey: graph-node
    repo: acme-labs/graph-node
    defaultBranch: main
    deconflictInRepoSchedules: none
    deconflictWorkflowIds: []
    driftAudit:
      enabled: false
      schedule: 0 6 * * 1
      upkeepStrategy: custom
      instructions: ""
      instructionsFile: null
      knowledgeSources:
        watchUrls: []
        packageManifests: []
        mcpServers: {}
      buildCommands: []
      verifyCommands: []
      draft: false
      reviewers: []
dependencyEdges:
  - edgeId: ae
    upstreamRepo: acme-labs/a
    upstreamKey: ae
    upstreamSlug: AE
    upstreamDefaultBranch: main
    initialBaselineSha: 000000000000000000000000000000000000001a
    downstreamRepo: acme-labs/e
    mode: mechanical
    schedule: null
    onCommitOnlyAdvance: noop
    stateVariable: SDLC_SYNC_STATE_AE
    provenanceFile: source.json
    provenanceJsonPointer: /commit
    branchName: sdlc/cascade-ae
    closeOlderKey: sdlc-cascade-ae
    reviewers:
      - graph-reviewer
    importCommands:
      - node import.mjs <checkout>
    preflightCommands: []
    acceptCommands: []
    buildCommands: []
    verifyCommands:
      - npm test
    adaptationInstructions: ""
    allowedFiles:
      - imported/**
    protectedFilesExclude: []
    autoMerge: false
    immutableGates:
      zeroDiffPaths: []
