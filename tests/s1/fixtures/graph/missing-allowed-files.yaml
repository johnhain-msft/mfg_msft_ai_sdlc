# An edge without allowedFiles.
projects:
  - projectKey: graph-node
    repo: acme-labs/graph-node
    defaultBranch: main
    deconflictInRepoSchedules: none
    deconflictWorkflowIds: []
    driftAudit:
      enabled: false
      schedule: 0 6 * * 1
      upkeepStrategy: custom
      instructions: ""
      instructionsFile: null
      knowledgeSources:
        watchUrls: []
        packageManifests: []
        mcpServers: {}
      buildCommands: []
      verifyCommands: []
      draft: false
      reviewers: []
dependencyEdges:
  - edgeId: ab
    upstreamRepo: acme-labs/a
    upstreamKey: ab
    upstreamSlug: AB
    upstreamDefaultBranch: main
    initialBaselineSha: "0000000000000000000000000000000000000014"
    downstreamRepo: acme-labs/b
    mode: mechanical
    schedule: null
    onCommitOnlyAdvance: noop
    stateVariable: SDLC_SYNC_STATE_AB
    provenanceFile: source.json
    provenanceJsonPointer: /commit
    branchName: sdlc/cascade-ab
    closeOlderKey: sdlc-cascade-ab
    reviewers:
      - graph-reviewer
    importCommands:
      - node import.mjs <checkout>
    preflightCommands: []
    acceptCommands: []
    buildCommands: []
    verifyCommands:
      - npm test
    adaptationInstructions: ""
    protectedFilesExclude: []
    autoMerge: false
    immutableGates:
      zeroDiffPaths: []
