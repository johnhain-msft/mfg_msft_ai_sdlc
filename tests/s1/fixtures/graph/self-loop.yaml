# An edge whose downstream is its own upstream: a cycle of length one.
projects:
  - projectKey: graph-node
    repo: acme-labs/graph-node
    defaultBranch: main
    deconflictInRepoSchedules: none
    deconflictWorkflowIds: []
    driftAudit:
      enabled: false
      schedule: 0 6 * * 1
      upkeepStrategy: custom
      instructions: ""
      instructionsFile: null
      knowledgeSources:
        watchUrls: []
        packageManifests: []
        mcpServers: {}
      buildCommands: []
      verifyCommands: []
      draft: false
      reviewers: []
dependencyEdges:
  - edgeId: loop
    upstreamRepo: acme-labs/a
    upstreamKey: loop
    upstreamSlug: LOOP
    upstreamDefaultBranch: main
    initialBaselineSha: "0000000000000000000000000000000000000001"
    downstreamRepo: acme-labs/a
    mode: mechanical
    schedule: null
    onCommitOnlyAdvance: noop
    stateVariable: SDLC_SYNC_STATE_LOOP
    provenanceFile: source.json
    provenanceJsonPointer: /commit
    branchName: sdlc/cascade-loop
    closeOlderKey: sdlc-cascade-loop
    reviewers:
      - graph-reviewer
    importCommands:
      - node import.mjs <checkout>
    preflightCommands: []
    acceptCommands: []
    buildCommands: []
    verifyCommands:
      - npm test
    adaptationInstructions: ""
    allowedFiles:
      - imported/**
    protectedFilesExclude: []
    autoMerge: false
    immutableGates:
      zeroDiffPaths: []
