            importCommands:
              - npm run import:ghec-admin -- <checkout>
            preflightCommands: []
            buildCommands:
              - npm run build
              - STUDIO_ORIGIN=https://studio.example.com npm run build:catalog
            verifyCommands:
              - npm run typecheck
              - npm run lint
              - npm test
              - npm run test:studio
              - npm run test:browser
          - edgeId: copilot-lab
            upstreamRepo: ms-mfg-community/day-in-the-life-copilot-lab
            upstreamKey: copilot-lab
            upstreamSlug: COPILOT_LAB
            upstreamDefaultBranch: main
            initialBaselineSha: 2108ac9a1e9eff96e97b500117b0de4a546768c3
            downstreamRepo: johnhain-msft/portfolio
            mode: ai-adaptation
            schedule: 0 */6 * * *
            onCommitOnlyAdvance: noop
            stateVariable: SDLC_SYNC_STATE_COPILOT_LAB
            provenanceFile: experiences/copilot-workshop/source-inputs.json
            provenanceJsonPointer: /commit
            onBots:
              - mfg-msft-ai-sdlc[bot]
            branchName: sdlc/cascade-copilot-lab
            closeOlderKey: sdlc-cascade-copilot-lab
            reviewers:
              - johnhain-msft
            importCommands: []
            preflightCommands:
              - npm run sync:workshop-source -- <checkout>
              - node "$GITHUB_WORKSPACE/src/lab-studio-drift.mjs" --portfolio "$GITHUB_WORKSPACE/portfolio" --upstream <checkout> --commit "$TARGET_SHA"
            buildCommands:
              - npm run build:workshop
            verifyCommands:
              - npm run build:workshop
              - npm run build:experiences
              - git -C "$GITHUB_WORKSPACE/portfolio" status --porcelain
              - npm run build
              - STUDIO_ORIGIN=https://studio.example.com npm run build:catalog
              - npm run typecheck
              - npm run lint
              - npm test
              - npm run test:studio
              - npm run test:browser
              - |
                # post-run check: a dry run must not leave a commit
                if [ "${DRY_RUN:-}" = "true" ] && [ "$AGENT_HEAD_SHA" != "$BASE_SHA" ]; then
                  echo "dry_run is true but the agent committed $BASE_SHA..$AGENT_HEAD_SHA" >&2
                  exit 1
                fi
              - |
                # post-run check: committed provenance records upstream_sha
                if [ "$AGENT_HEAD_SHA" != "$BASE_SHA" ]; then
                  node --input-type=module -e '
                  import { readFileSync } from "node:fs";
                  const root = process.env.GITHUB_WORKSPACE + "/portfolio/";
                  const want = process.env.UPSTREAM_SHA;
                  const read = (file) => {
                    try { return JSON.parse(readFileSync(root + file, "utf8")); }
                    catch { console.error("provenance file is missing or unparseable: " + file); process.exit(1); }
                  };
                  const revision = read("experiences/copilot-workshop/provenance.json");
                  const inputs = read("experiences/copilot-workshop/source-inputs.json");
                  const studio = read("apps/lab-studio/lab-sources.json");
                  const stale = [];
                  if (revision.commit !== want) stale.push("provenance.json commit");
                  if (revision.documentCommit !== want) stale.push("provenance.json documentCommit");
                  if (inputs.commit !== want) stale.push("source-inputs.json commit");
                  if (!studio._provenance || studio._provenance.commit !== want) stale.push("lab-sources.json _provenance.commit");
                  if (stale.length > 0) { console.error("stale provenance: " + stale.join(", ")); process.exit(1); }
                  '
                  node "$GITHUB_WORKSPACE/src/lab-studio-drift.mjs" --portfolio "$GITHUB_WORKSPACE/portfolio" --upstream <checkout> --commit "$UPSTREAM_SHA"
                fi
              - |
                # post-run check: the upstream checkout stays read-only
                test -z "$(git -C <checkout> status --porcelain)"
