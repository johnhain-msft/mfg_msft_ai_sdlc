              - STUDIO_ORIGIN=https://studio.example.com npm run build:catalog
            verifyCommands:
              - npm run typecheck
              - npm run lint
              - npm test
              - npm run test:studio
              - npm run test:browser
    concurrency:
      group: sdlc-state-${{ matrix.upstreamKey }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - name: Route the upstream
        env:
          UPSTREAM_KEY: ${{ matrix.upstreamKey }}
          EDGE_JSON: ${{ toJSON(matrix) }}
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          RESET_BLOCKED: ${{ inputs.reset_blocked }}
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
