            upstreamDefaultBranch: main
            initialBaselineSha: c00b58a9fea6cbbbe9b1ac8f52c3632aafc32b46
            downstreamRepo: johnhain-msft/portfolio
            mode: ai-adaptation
            schedule: 0 */6 * * *
            onCommitOnlyAdvance: noop
            stateVariable: SDLC_SYNC_STATE_PIPELINE_SHOWCASE
            provenanceFile: experiences/pipeline-showcase/content/provenance.json
            provenanceJsonPointer: /commit
            onBots:
              - mfg-msft-ai-sdlc[bot]
            branchName: sdlc/cascade-pipeline-showcase
            closeOlderKey: sdlc-cascade-pipeline-showcase
            reviewers:
              - johnhain-msft
            importCommands: []
            preflightCommands:
              - gh api "repos/ms-mfg-community/github-pipeline-showcase/actions/runs?per_page=100"
