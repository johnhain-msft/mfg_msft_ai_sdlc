            upstreamRepo: johnhain-msft/gh-admin-msft
            upstreamKey: gh-admin-msft
            upstreamSlug: GH_ADMIN_MSFT
            upstreamDefaultBranch: main
            initialBaselineSha: a2f9a3bbbb60df80a7c4fed8428d061898f504dc
            downstreamRepo: johnhain-msft/portfolio
            mode: mechanical
            schedule: 0 */6 * * *
            onCommitOnlyAdvance: noop
            stateVariable: SDLC_SYNC_STATE_GH_ADMIN_MSFT
            provenanceFile: public/ghec-admin/source.json
            provenanceJsonPointer: /commit
            onBots:
              - mfg-msft-ai-sdlc[bot]
            branchName: sdlc/cascade-ghec-admin
            closeOlderKey: sdlc-cascade-ghec-admin
            reviewers:
