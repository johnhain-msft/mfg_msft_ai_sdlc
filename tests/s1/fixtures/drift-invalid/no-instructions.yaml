# Rejected: neither inline instructions nor an instructionsFile.
projects:
  - projectKey: no-instructions
    repo: acme-labs/no-instructions
    defaultBranch: main
    driftAudit:
      enabled: true
      schedule: "0 6 * * 1"
      upkeepStrategy: content-and-docs-sync
      instructions: ""
      instructionsFile: null
      knowledgeSources:
        watchUrls:
          - url: https://example.org/changelog
            label: Changelog
            kind: changelog
        packageManifests: []
        mcpServers: {}
      buildCommands: []
      verifyCommands:
        - npm test
      draft: false
      reviewers:
        - acme-reviewer
