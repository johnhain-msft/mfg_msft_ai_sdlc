# Rejected: a watched URL with a wildcard host (gh aw compile --strict forbids wildcard domains).
projects:
  - projectKey: wildcard-docs
    repo: acme-labs/wildcard-docs
    defaultBranch: main
    driftAudit:
      enabled: true
      schedule: "0 6 * * 1"
      upkeepStrategy: content-and-docs-sync
      instructions: Keep the documentation current.
      instructionsFile: null
      knowledgeSources:
        watchUrls:
          - url: https://*.github.com/
            label: Every GitHub host
            kind: docs
        packageManifests: []
        mcpServers: {}
      buildCommands: []
      verifyCommands:
        - npm test
      draft: false
      reviewers:
        - acme-reviewer
