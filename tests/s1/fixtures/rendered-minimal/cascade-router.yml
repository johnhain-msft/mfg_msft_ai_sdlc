# Generated by src/reconcile.mjs from the fleet manifest. Do not edit.
name: SDLC cascade router
on:
  repository_dispatch:
    types:
      - upstream_pr_merged
  schedule:
    - cron: 0 */4 * * *
  workflow_dispatch:
    inputs:
      reset_blocked:
        description: Clear the failure and blocked state of every upstream before routing
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
jobs:
  route:
    name: route ${{ matrix.upstreamKey }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        upstreamKey:
          - alpha-service
        include:
          - edgeId: alpha-to-beta
            upstreamRepo: acme-labs/alpha-service
            upstreamKey: alpha-service
            upstreamSlug: ALPHA_SERVICE
            upstreamDefaultBranch: main
            initialBaselineSha: 0123456789abcdef0123456789abcdef01234567
            downstreamRepo: globex-corp/beta-docs
            mode: mechanical
            schedule: 0 */4 * * *
            onCommitOnlyAdvance: noop
            stateVariable: SDLC_SYNC_STATE_ALPHA_SERVICE
            provenanceFile: docs/source.json
            provenanceJsonPointer: /commit
            onBots:
              - mfg-msft-ai-sdlc[bot]
            branchName: sdlc/cascade-alpha-to-beta
            closeOlderKey: sdlc-cascade-alpha-to-beta
            reviewers:
              - globex-reviewer
            importCommands:
              - node scripts/import.mjs <checkout>
            preflightCommands: []
            buildCommands:
              - npm run build
            verifyCommands:
              - npm test
    concurrency:
      group: sdlc-state-${{ matrix.upstreamKey }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - name: Route the upstream
        env:
          UPSTREAM_KEY: ${{ matrix.upstreamKey }}
          EDGE_JSON: ${{ toJSON(matrix) }}
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          RESET_BLOCKED: ${{ inputs.reset_blocked }}
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          ISSUES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$GITHUB_WORKSPACE/src/route-upstream.mjs"
