# An empty fleet manifest: the only thing in it to preserve is this comment.
projects:
  - projectKey: node-app
    repo: example-owner/node-app
    defaultBranch: main
    deconflictInRepoSchedules: none
    deconflictWorkflowIds: []
    driftAudit:
      enabled: true
      schedule: "23 6 * * 1"
      upkeepStrategy: dependency-and-pattern-modernization
      instructions: ""
      instructionsFile: instructions/node-app.md
      knowledgeSources:
        watchUrls: []
        packageManifests:
          - package.json
        mcpServers:
          context7:
            command: npx
            args:
              - -y
              - "@upstash/context7-mcp@latest"
      buildCommands:
        - npm run build
      verifyCommands:
        - npm test
      draft: false
      reviewers: []
  - projectKey: edge-ok
    repo: example-owner/edge-ok
    defaultBranch: main
    deconflictInRepoSchedules: none
    deconflictWorkflowIds: []
    driftAudit:
      enabled: false
      schedule: "23 6 * * 1"
      upkeepStrategy: content-and-docs-sync
      instructions: ""
      instructionsFile: null
      knowledgeSources:
        watchUrls: []
        packageManifests:
          - package.json
        mcpServers: {}
      buildCommands:
        - npm run build
      verifyCommands:
        - npm test
      draft: false
      reviewers:
        - hub-reviewer

dependencyEdges:
  - edgeId: node-app
    upstreamRepo: example-owner/node-app
    upstreamKey: node-app
    upstreamSlug: NODE_APP
    upstreamDefaultBranch: main
    initialBaselineSha: "2222222222222222222222222222222222222222"
    downstreamRepo: example-owner/edge-ok
    mode: ai-adaptation
    schedule: null
    onCommitOnlyAdvance: noop
    stateVariable: SDLC_SYNC_STATE_NODE_APP
    provenanceFile: public/imported/source.json
    provenanceJsonPointer: /commit
    branchName: sdlc/cascade-node-app
    closeOlderKey: sdlc-cascade-node-app
    reviewers:
      - hub-reviewer
    importCommands: []
    preflightCommands: []
    acceptCommands: []
    buildCommands:
      - npm run build
    verifyCommands:
      - npm test
    adaptationInstructions: ""
    allowedFiles:
      - public/imported/**
    protectedFilesExclude: []
    autoMerge: false
    immutableGates:
      zeroDiffPaths: []
