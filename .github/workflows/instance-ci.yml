# The tests of this repository, run on every pull request. A plain Actions workflow, like sdlc-bridge-dispatch.yml: nothing generates it, `gh aw compile` does not see it,
# and it calls no agent. It is the CI of the instance (design I.4, M step 13): `npm test` runs the instance tests, among them tests/parity.test.mjs, which renders the fleet
# from sdlc.yaml with the pinned engine and requires that it equals the committed .github/workflows byte for byte. Bumping the engine without regenerating fails it, and
# regenerating shows the difference in the pull request.
#
# The engine (ai-sdlc-factory) is a dependency of this repository and its repository is public, so the install is the one that every generated job does:
# `npm ci --ignore-scripts`, with no token step and no git rewrites. Nothing is written to ~/.gitconfig, and the checkout keeps no credential.
#
# Every action is pinned by commit, with the pin that .github/aw/actions-lock.json holds for it (tests/instance-ci.test.mjs checks it).
name: Instance CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instance-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install the dependencies
        run: npm ci --ignore-scripts

      - name: Run the tests
        run: npm test
